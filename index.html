<h1>rclone-backup</h1>
<p>rclone-backup is a personal backup tool. It has one user: its author, who runs it on the author's own computer.</p>
<p>It uses <a href="https://rclone.org">rclone</a> to keep a backup copy of a few folders on the author's computer in one folder of the author's own Google Drive.</p>
